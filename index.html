
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Ranjan | UI/UX Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    overflow-x: hidden;
}

#portfolio {
    width: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="portfolio"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function loadPortfolio() {

    const pdf = await pdfjsLib.getDocument(
        './ANKITA%20PDF%20PORTFOLIO.pdf'
    ).promise;

    const container = document.getElementById('portfolio');

    for (let i = 1; i <= pdf.numPages; i++) {

        const page = await pdf.getPage(i);
        const original = page.getViewport({ scale: 1 });

        const scale = Math.min(
            window.innerWidth / original.width,
            1.8
        );

        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        container.appendChild(canvas);

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;
    }
}

loadPortfolio().catch(console.error);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Ranjan | Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
}

#pdf-container {
    width: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="pdf-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const url = './ANKITA%20PDF%20PORTFOLIO.pdf';

async function showPDF() {
    const pdf = await pdfjsLib.getDocument(url).promise;
    const container = document.getElementById('pdf-container');

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);

        const viewport = page.getViewport({ scale: 1 });
        const scale = container.clientWidth / viewport.width;
        const scaledViewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;

        container.appendChild(canvas);

        await page.render({
            canvasContext: context,
            viewport: scaledViewport
        }).promise;
    }
}

showPDF();
</script>

</body>
</html>
