
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ankita Ranjan | UI/UX Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #ffffff;
            overflow-x: hidden;
        }

        #portfolio {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .pdf-page {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        #loading {
            text-align: center;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: #555;
        }

        #error {
            text-align: center;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: #d00;
        }
    </style>

</head>

<body>

    <div id="loading">Loading portfolio...</div>

    <div id="portfolio"></div>

    <div id="error"></div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>

        // PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


        async function loadPortfolio() {

            const container = document.getElementById('portfolio');

            const loading = document.getElementById('loading');

            const errorBox = document.getElementById('error');

            try {

                // Load original PDF
                const pdf = await pdfjsLib.getDocument({
                    url: './ANKITA%20PDF%20PORTFOLIO.pdf'
                }).promise;

                loading.style.display = 'none';

                // High resolution rendering
                const pixelRatio = Math.min(
                    Math.max(window.devicePixelRatio || 1, 2),
                    3
                );

                // Render all PDF pages
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

                    const page = await pdf.getPage(pageNumber);

                    // Original page dimensions
                    const originalViewport = page.getViewport({
                        scale: 1
                    });

                    // Responsive display width
                    const displayWidth = container.clientWidth;

                    const displayScale = displayWidth / originalViewport.width;

                    // Display viewport
                    const viewport = page.getViewport({
                        scale: displayScale
                    });

                    // Create canvas
                    const canvas = document.createElement('canvas');

                    const context = canvas.getContext('2d', {
                        alpha: false
                    });

                    // Actual high-resolution canvas dimensions
                    canvas.width = Math.ceil(viewport.width * pixelRatio);

                    canvas.height = Math.ceil(viewport.height * pixelRatio);

                    // Display dimensions
                    canvas.style.width = '100%';

                    canvas.style.height = 'auto';

                    canvas.className = 'pdf-page';

                    // Add page to website
                    container.appendChild(canvas);

                    // Render PDF page
                    await page.render({

                        canvasContext: context,

                        viewport: viewport,

                        transform: [
                            pixelRatio, 0,
                            0, pixelRatio,
                            0, 0
                        ],

                        intent: 'display'

                    }).promise;

                }

            } catch (error) {

                console.error('PDF loading error:', error);

                loading.style.display = 'none';

                errorBox.textContent =
                    'Unable to load portfolio. Please refresh the page.';

            }

        }


        // Start loading
        loadPortfolio();

    </script>

</body>

</html>
