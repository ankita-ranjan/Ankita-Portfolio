
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankita Ranjan | UI/UX Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            overflow-x: hidden;
        }

        #portfolio {
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div id="portfolio"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function loadPortfolio() {
            const container = document.getElementById('portfolio');

            try {
                const pdf = await pdfjsLib.getDocument(
                    './ANKITA%20PDF%20PORTFOLIO.pdf'
                ).promise;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);

                    const original = page.getViewport({ scale: 1 });

                    const scale = container.clientWidth / original.width;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);

                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';

                    container.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                }

            } catch (error) {
                console.error('Portfolio loading error:', error);
                container.innerHTML =
                    '<p style="padding:30px;text-align:center;">Unable to load portfolio. Please refresh the page.</p>';
            }
        }

        loadPortfolio();
    </script>

</body>
</html>
